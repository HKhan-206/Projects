<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strawberry Millions Milkshake – promo</title>
<style>
  @font-face { font-family: "Brush"; src: url(fonts/knewave-latin-400-normal.woff2) format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; overflow: hidden; transform-origin: center; }
  .layer { position: absolute; left: 0; top: 0; }
  canvas.layer { width: 1080px; height: 1920px; }
  #glow { position: absolute; inset: 0; background: radial-gradient(70% 45% at 50% 62%, rgba(255,255,255,0.22), rgba(255,255,255,0) 70%); }
  #shake { position: absolute; will-change: transform; filter: drop-shadow(0 40px 40px rgba(0, 70, 60, 0.28)); }
  .piece { position: absolute; will-change: transform; filter: drop-shadow(0 18px 18px rgba(0, 70, 60, 0.25)); }
  #title { position: absolute; left: 0; right: 0; text-align: center; transform: rotate(-4deg); }
  #title .line { display: block; font-family: "Brush", sans-serif; font-size: 150px; line-height: 0.95; white-space: nowrap; }
  #title .ch { display: inline-block; color: #ffffff; -webkit-text-stroke: 12px #8f0f1e; paint-order: stroke fill;
    text-shadow: 0 10px 0 rgba(90, 0, 15, 0.45); will-change: transform; }
</style>
</head>
<body>
<div id="stage">
  <div id="glow"></div>
  <canvas id="strawberry" class="layer" width="1080" height="1920"></canvas>
  <canvas id="syrup" class="layer" width="1080" height="1920"></canvas>
  <div id="pieces"></div>
  <img id="shake" alt="Strawberry Millions Milkshake">
  <div id="title"></div>
</div>
<script src="gsap.min.js"></script>
<script src="promo.config.js"></script>
<script src="composite.js"></script>
</body>
</html>
