<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Strawberry Millions Milkshake – promo</title>
<style>
  @font-face { font-family: "Marker"; src: url(fonts/permanent-marker-latin-400-normal.woff2) format("woff2"); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; cursor: none; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1080px; height: 1920px; overflow: hidden; transform-origin: center; }
  canvas.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #glow { position: absolute; inset: 0;
    background: radial-gradient(75% 50% at 50% 48%, rgba(255,255,255,0.38), rgba(255,255,255,0) 72%); }
  #shakeWrap { position: absolute; will-change: transform, filter; }
  #shake { display: block; width: 100%; height: 100%; filter: drop-shadow(0 34px 34px rgba(0, 70, 60, 0.30)); }
  .piece { position: absolute; will-change: transform; filter: drop-shadow(0 16px 16px rgba(0, 70, 60, 0.25)); }
  #title { position: absolute; left: 0; right: 0; text-align: center; transform: rotate(-3deg); }
  #title .line { display: block; font-family: "Marker", sans-serif; line-height: 1.0; white-space: nowrap; }
  #title .ch { display: inline-block; color: #ffffff; -webkit-text-stroke: 5px #6e0a1a; paint-order: stroke fill;
    text-shadow: 0 6px 14px rgba(0, 60, 55, 0.35); will-change: transform; }
</style>
</head>
<body>
<div id="stage">
  <div id="world" style="position:absolute;inset:0;transform-origin:50% 60%">
    <div id="glow"></div>
    <div id="title"></div>
    <canvas id="splash" class="layer" width="1080" height="1920"></canvas>
    <canvas id="strawberry" class="layer" width="1080" height="1920"></canvas>
    <div id="shakeWrap"><img id="shake" alt="Strawberry Millions Milkshake"></div>
    <div id="pieces"></div>
  </div>
</div>
<script src="gsap.min.js"></script>
<script src="promo.config.js"></script>
<script src="layers/strawberry-centres.js"></script>
<script src="composite.js"></script>
</body>
</html>
